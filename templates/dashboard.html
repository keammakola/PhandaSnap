<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhandaSnap — Your Campaigns</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --hustle-yellow:#F5B900;
    --kasi-red:#D6342C;
    --spaza-green:#1E7A46;
    --taxi-blue:#1A3E8C;
    --charcoal:#231F20;
    --chalk:#FBF8F2;
    --chalk-dim:#EFE9DD;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--chalk-dim);
    color:var(--charcoal);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }

  .phone{
    width:100%;
    max-width:400px;
    background:var(--chalk);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(35,31,32,0.25);
    display:flex;
    flex-direction:column;
    min-height:680px;
  }

  .topstrip{
    background:var(--hustle-yellow);
    color:var(--charcoal);
    font-weight:700;
    font-size:13px;
    padding:10px 20px;
    text-align:center;
    letter-spacing:0.02em;
  }

  .content{
    flex:1;
    padding:28px 24px 20px;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    color:var(--taxi-blue);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:6px;
  }

  h1{
    font-family:'Archivo Black',sans-serif;
    font-size:26px;
    line-height:1.15;
    margin:0 0 8px;
    color:var(--charcoal);
  }

  .subtext{font-size:14px;color:#5b5654;margin:0 0 24px;line-height:1.5;}

  /* loading */
  .stamp-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:16px;
  }
  .spinner{
    width:40px;height:40px;
    border:4px solid var(--chalk-dim);
    border-top-color:var(--kasi-red);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-label{font-size:14px;color:#5b5654;}

  /* results */
  .campaign-block{
    background:#fff;
    border-radius:20px;
    padding:18px;
    box-shadow:0 12px 24px rgba(35,31,32,0.08);
    margin-bottom:16px;
  }
  .campaign-block:last-child{margin-bottom:0;}
  .campaign-title{font-family:'Archivo Black',sans-serif;font-size:15px;margin:0 0 4px;}
  .campaign-meta{font-size:13px;color:#7f7a75;margin-bottom:14px;}
  .copy-row{margin-bottom:12px;}
  .copy-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.07em;
    color:var(--taxi-blue);display:block;margin-bottom:4px;
  }
  .copy-box{
    background:var(--chalk-dim);
    padding:12px 14px;border-radius:12px;
    font-size:13px;line-height:1.55;color:#403b37;
    white-space:pre-wrap;word-break:break-word;
  }
  audio{width:100%;margin-top:10px;border-radius:8px;}

  .step{display:none;}
  .step.active{display:flex;flex-direction:column;flex:1;}
</style>
</head>
<body>

<div class="phone">
  <div class="topstrip" id="topstrip">Building your campaign…</div>

  <div class="content">

    <!-- Loading -->
    <div class="step active" data-step="1">
      <div class="stamp-wrap">
        <div class="spinner"></div>
        <div class="loading-label" id="loadingLabel">Generating your campaign…</div>
      </div>
    </div>

    <!-- Results -->
    <div class="step" data-step="2">
      <div class="eyebrow">Your campaign</div>
      <h1 id="resultsHeading"></h1>
      <p class="subtext" id="resultsSubtext"></p>
      <div id="resultsContent"></div>
    </div>

  </div>
</div>

<script>
let dashboard = null;

function getCopy(cs, lang) {
  if (!cs) return '';
  return {
    English: cs.english_caption || cs.caption,
    isiZulu: cs.zulu_caption || cs.caption,
    Afrikaans: cs.afrikaans_caption || cs.caption,
    Sesotho: cs.sesotho_caption || cs.caption
  }[lang] || cs.caption || '';
}

function renderResults() {
  const profile = dashboard.profile || {};
  const language = profile.language || 'English';
  const materials = profile.materials || [];
  const item = (dashboard.calendar || [])[0];
  const cs = item?.assets?.copy_suite || {};
  const caption = getCopy(cs, language);

  document.getElementById('topstrip').textContent = 'Your campaign';
  document.getElementById('resultsHeading').textContent = profile.store_name || 'Your campaign';
  document.getElementById('resultsSubtext').textContent = `${item?.concept || ''} · ${language}`;

  const MATERIAL_MAP = [
    { keys: ['Story poster'],                    label: 'Caption',          value: caption },
    { keys: ['WhatsApp caption'],                label: 'WhatsApp message', value: cs.whatsapp_text },
    { keys: ['Community WhatsApp group'],        label: 'Community WA group', value: cs.community_whatsapp_group },
    { keys: ['TikTok script'],                   label: 'TikTok script',    value: cs.tiktok_script },
    { keys: ['Voiceover', 'WhatsApp voice note'],label: 'Voiceover script', value: cs.voiceover },
  ];

  const rows = MATERIAL_MAP
    .filter(m => m.keys.some(k => materials.includes(k)) && m.value)
    .map(m => `<div class="copy-row"><span class="copy-label">${m.label}</span><div class="copy-box">${m.value}</div></div>`)
    .join('');

  const hasAudio = materials.some(m => ['Voiceover','WhatsApp voice note'].includes(m)) && item?.assets?.voiceover_url;

  document.getElementById('resultsContent').innerHTML = `
    <div class="campaign-block">
      <div class="campaign-meta">${item?.day_name} · ${item?.date} · ${item?.channel}</div>
      ${rows || '<div class="copy-box" style="color:#9a9490">No assets generated.</div>'}
      ${hasAudio ? `<audio controls src="${item.assets.voiceover_url}"></audio><a href="${item.assets.voiceover_url}" download="voiceover.wav" style="display:block;margin-top:10px;text-align:center;padding:12px;background:var(--chalk-dim);border-radius:10px;font-weight:700;font-size:13px;color:var(--charcoal);text-decoration:none;">⬇ Download voiceover</a>` : ''}
    </div>
  `;

  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.querySelector('.step[data-step="2"]').classList.add('active');
}

async function init() {
  const res = await fetch('/api/dashboard');
  if (!res.ok) {
    document.getElementById('loadingLabel').textContent = 'Could not load campaigns.';
    return;
  }
  dashboard = await res.json();
  const language = dashboard.profile?.language || 'English';
  const item = (dashboard.calendar || [])[0];

  if (!item) {
    document.getElementById('loadingLabel').textContent = 'No campaigns found.';
    return;
  }

  const r = await fetch('/api/calendar/generate-assets', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: item.id, language})
  });

  if (r.ok) {
    const updated = await r.json();
    dashboard.calendar[0] = updated;
  }

  renderResults();
}

init();
</script>
</body>
</html>
